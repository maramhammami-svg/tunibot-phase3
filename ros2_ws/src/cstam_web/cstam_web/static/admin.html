<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · TuniBot</title>
  <link rel="stylesheet" href="/static/common.css">
  <link rel="stylesheet" href="/static/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,700;12..96,75..100,800&display=swap">
  <link rel="stylesheet" href="/static/theme-nuit.css">
</head>
<body class="theme-nuit">
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true" data-icon="robot"></div>
      <div>
        <div class="brand-title">TuniBot · Admin</div>
        <div class="brand-sub" id="world-title"></div>
      </div>
    </div>
    <div class="top-pills">
      <span class="pill" id="state-pill"><span class="dot"></span><span id="state-text">—</span></span>
      <span class="pill" id="battery-pill"><span class="ico-slot" aria-hidden="true" data-icon="battery"></span><span id="battery-pill-text">—</span></span>
      <span class="pill" id="conn-pill"><span class="dot"></span><span id="conn-text">…</span></span>
      <button class="btn small lang-btn" id="lang-btn" type="button">EN</button>
      <a class="btn small" href="/" target="_blank" rel="noopener"><span data-i18n="a_client_page"></span> ↗</a>
    </div>
  </header>
  <div class="banner demo hidden" id="demo-banner" data-i18n="a_demo_banner"></div>
  <div class="banner offline hidden" id="offline-banner" data-i18n="a_offline_banner"></div>

  <main class="admin-grid">
    <!-- LEFT: robot & battery -->
    <section class="col">
      <div class="card">
        <div class="card-head"><h3 data-i18n="a_battery"></h3><span class="chip" id="battery-status-chip">—</span></div>
        <div class="battery-big">
          <div class="gauge" role="meter" data-i18n-aria="a_battery_level" aria-valuemin="0" aria-valuemax="100" id="battery-meter">
            <div class="gauge-fill" id="gauge-fill"></div>
            <div class="gauge-mark low"></div>
            <div class="gauge-mark critical"></div>
          </div>
          <div class="battery-pct mono" id="battery-pct">—</div>
        </div>
        <div class="metrics">
          <div><span class="label" data-i18n="a_voltage"></span><span class="mono" id="m-voltage">—</span></div>
          <div><span class="label" data-i18n="a_current"></span><span class="mono" id="m-current">—</span></div>
          <div><span class="label" data-i18n="a_power"></span><span class="mono" id="m-power">—</span></div>
          <div><span class="label" data-i18n="a_temperature"></span><span class="mono" id="m-temp">—</span></div>
          <div class="wide"><span class="label" data-i18n="a_runtime"></span><span class="mono" id="m-runtime">—</span></div>
        </div>
        <canvas id="battery-chart" class="spark" height="70" data-i18n-aria="a_spark_caption"></canvas>
        <div class="spark-caption muted" data-i18n="a_spark_caption"></div>
      </div>

      <div class="card">
        <div class="card-head"><h3 data-i18n="a_robot"></h3></div>
        <div class="metrics">
          <div class="wide"><span class="label" data-i18n="a_current_task"></span><span id="r-task">—</span></div>
          <div><span class="label" data-i18n="a_position"></span><span class="mono" id="r-pos">—</span></div>
          <div><span class="label" data-i18n="a_delivered"></span><span class="mono" id="r-done">0</span></div>
          <div class="wide"><span class="label" data-i18n="a_pedestrian"></span><span id="r-obstacle">—</span></div>
        </div>
        <h3 class="sub-h" data-i18n="a_health"></h3>
        <ul class="health" id="health"></ul>
      </div>
    </section>

    <!-- CENTER: map -->
    <section class="col center">
      <div class="card map-card">
        <div class="card-head"><h3 data-i18n="a_map"></h3><span class="map-legend muted small" id="map-legend"><span class="lg"><i class="sw robot"></i><span data-i18n="a_lg_robot"></span></span><span class="lg"><i class="sw person"></i><span data-i18n="a_lg_person"></span></span><span class="lg"><i class="sw dock"></i><span data-i18n="a_lg_dock"></span></span><span class="lg"><i class="sw kitchen"></i><span data-i18n="a_lg_kitchen"></span></span><span class="lg-tip" data-i18n="a_legend"></span></span></div>
        <div class="map-wrap"><canvas id="map" data-i18n-aria="a_map"></canvas></div>
      </div>
      <div class="card">
        <div class="card-head"><h3 data-i18n="a_events"></h3></div>
        <ul class="events" id="events" aria-live="polite"></ul>
      </div>
    </section>

    <!-- RIGHT: queue & controls -->
    <section class="col">
      <div class="card">
        <div class="card-head"><h3 data-i18n="a_queue"></h3><span class="chip" id="queue-count">0</span></div>
        <ul class="queue" id="queue"></ul>
        <div class="lock-note hidden" id="lock-note" data-i18n="a_lock_note"></div>
      </div>

      <div class="card">
        <div class="card-head"><h3 data-i18n="a_controls"></h3></div>
        <div class="btn-grid">
          <button class="btn warn" id="dock-btn" type="button"><span class="ico-slot" data-icon="plug"></span><span data-i18n="a_dock"></span></button>
          <button class="btn" id="undock-btn" type="button"><span class="ico-slot" data-icon="undock"></span><span data-i18n="a_undock"></span></button>
          <button class="btn" id="kitchen-btn" type="button"><span class="ico-slot" data-icon="pot"></span><span data-i18n="a_kitchen"></span></button>
        </div>
        <div class="dispatch">
          <label for="dispatch-target" class="label" data-i18n="a_send_to"></label>
          <div class="dispatch-row">
            <select id="dispatch-target"></select>
            <button class="btn small" id="dispatch-btn" type="button" data-i18n="a_go"></button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3 data-i18n="a_tests"></h3><span class="muted small" data-i18n="a_for_demo"></span></div>
        <div class="label" data-i18n="a_battery_level"></div>
        <div class="btn-row">
          <button class="btn small" data-battery="100" type="button">100%</button>
          <button class="btn small warn" data-battery="24" type="button">24% <span data-i18n="a_low"></span></button>
          <button class="btn small danger" data-battery="14" type="button">14% <span data-i18n="a_critical"></span></button>
        </div>
        <div class="label" data-i18n="a_ped_obstacle"></div>
        <div class="btn-row">
          <button class="btn small" data-obstacle="patrol" type="button" data-i18n="a_patrol"></button>
          <button class="btn small" data-obstacle="cross" type="button" data-i18n="a_cross"></button>
          <button class="btn small" data-obstacle="block" type="button" data-i18n="a_block"></button>
          <button class="btn small" data-obstacle="clear" type="button" data-i18n="a_clear"></button>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/i18n.js"></script>
  <script src="/static/map.js"></script>
  <script src="/static/icons.js"></script>
  <script src="/static/admin.js"></script>
</body>
</html>
